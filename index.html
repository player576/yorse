<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yorse Catalog</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 15px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
    input, button { padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    input { flex: 1; }
    button { cursor: pointer; background: #000; color: #fff; border: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; background: #fafafa; }
    .card h3 { margin: 0 0 5px 0; font-size: 1.1rem; }
    .card p { margin: 0 0 10px 0; color: #666; font-size: 0.9rem; }
    .card .id-badge { background: #e0e0e0; font-family: monospace; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }
    .card a { display: inline-block; margin-top: 10px; color: #0066cc; text-decoration: none; }
  </style>
</head>
<body>

  <h1>Yorse Library</h1>

  <!-- Поиск по названию или ID -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Поиск по названию книги, автору или 6-значному ID..." />
    <button onclick="handleSearch()">Найти</button>
  </div>

  <h2>Каталог книг</h2>
  <div id="booksGrid" class="grid">Загрузка книг...</div>

  <script>
    // Загрузка книг при открытии страницы
    async function loadBooks(query = '') {
      const grid = document.getElementById('booksGrid');
      grid.innerHTML = 'Загрузка...';

      let url = '/api';
      if (query) {
        url += query.length === 6 && !query.includes(' ') 
          ? `?id=${encodeURIComponent(query)}` 
          : `?search=${encodeURIComponent(query)}`;
      }

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Ошибка загрузки');

        const books = Array.isArray(data) ? data : [data];

        if (books.length === 0) {
          grid.innerHTML = '<p>Книги не найдены</p>';
          return;
        }

        grid.innerHTML = books.map(book => `
          <div class="card">
            <span class="id-badge">ID: ${book.id}</span>
            <h3>${escapeHtml(book.title)}</h3>
            <p>Автор: ${escapeHtml(book.author)}</p>
            <a href="${book.file_url}" target="_blank" download>Скачать .hpsep</a>
          </div>
        `).join('');

      } catch (err) {
        grid.innerHTML = `<p style="color:red">${err.message}</p>`;
      }
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.trim();
      loadBooks(q);
    }

    // Поиск по нажатию Enter
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    // Инициализация
    loadBooks();
  </script>
</body>
</html>
